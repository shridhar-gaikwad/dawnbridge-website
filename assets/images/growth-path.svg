<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560">
  <!-- Build / Staff / Grow path: milestones climbing to a summit (original artwork) -->
  <defs>
    <linearGradient id="g-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F6E98"/>
      <stop offset="1" stop-color="#0B2A3B"/>
    </linearGradient>
    <linearGradient id="g-mtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7CC6EE" stop-opacity=".35"/>
      <stop offset="1" stop-color="#7CC6EE" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="640" height="560" fill="url(#g-bg)"/>

  <!-- Sun / horizon rings -->
  <g fill="none" stroke="#F2F5F7" stroke-opacity=".12" stroke-width="1.5">
    <circle cx="500" cy="120" r="60"/><circle cx="500" cy="120" r="100"/><circle cx="500" cy="120" r="140"/>
  </g>
  <circle cx="500" cy="120" r="30" fill="#F2F5F7" fill-opacity=".9"/>

  <!-- Mountains -->
  <path d="M0 420L120 300 200 360 330 200 430 300 520 230 640 340V560H0z" fill="url(#g-mtn)"/>
  <path d="M0 420L120 300 200 360 330 200 430 300 520 230 640 340" fill="none" stroke="#DCEAF2" stroke-opacity=".5" stroke-width="2" stroke-linejoin="round"/>

  <!-- Winding path -->
  <path d="M60 530C180 520 120 450 220 430S340 400 330 330 420 260 470 200" fill="none" stroke="#F2F5F7" stroke-width="4" stroke-dasharray="2 12" stroke-linecap="round"/>

  <!-- Milestone flags -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="2.5" text-anchor="middle">
    <g>
      <path d="M220 430v-56" stroke="#F2F5F7" stroke-width="3" stroke-linecap="round"/>
      <rect x="220" y="372" width="86" height="30" rx="4" fill="#F2F5F7"/>
      <text x="263" y="393" fill="#16587B">BUILD</text>
      <circle cx="220" cy="430" r="8" fill="#7CC6EE" stroke="#F2F5F7" stroke-width="3"/>
    </g>
    <g>
      <path d="M332 330v-56" stroke="#F2F5F7" stroke-width="3" stroke-linecap="round"/>
      <rect x="332" y="272" width="86" height="30" rx="4" fill="#F2F5F7"/>
      <text x="375" y="293" fill="#16587B">STAFF</text>
      <circle cx="332" cy="330" r="8" fill="#7CC6EE" stroke="#F2F5F7" stroke-width="3"/>
    </g>
    <g>
      <path d="M470 200v-60" stroke="#F2F5F7" stroke-width="3" stroke-linecap="round"/>
      <rect x="470" y="138" width="86" height="30" rx="4" fill="#7CC6EE"/>
      <text x="513" y="159" fill="#0B2A3B">GROW</text>
      <circle cx="470" cy="200" r="9" fill="#F2F5F7"/>
    </g>
  </g>

  <!-- Small chart in the foreground -->
  <g fill="#F2F5F7" fill-opacity=".9">
    <rect x="470" y="470" width="20" height="40" rx="3"/>
    <rect x="500" y="450" width="20" height="60" rx="3"/>
    <rect x="530" y="420" width="20" height="90" rx="3"/>
    <rect x="560" y="390" width="20" height="120" rx="3"/>
  </g>
  <path d="M456 510h140" stroke="#F2F5F7" stroke-width="2"/>
</svg>
